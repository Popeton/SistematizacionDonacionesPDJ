<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ayudas - Centro de Acopio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 20px; padding: 15px; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .cargando { background-color: #ccc !important; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Registro de Inventario</h2>
    <form id="formularioAcopio">
        
        <label>Tipo de Movimiento:</label>
        <select id="movimiento" required>
            <option value="Entrada">Entrada (Recibir donación)</option>
            <option value="Salida">Salida (Entregar ayuda)</option>
        </select>

        <label>Categoría:</label>
        <select id="categoria" onchange="verificarCategoria()" required>
            <option value="">Seleccione...</option>
            <option value="Alimentos">Alimentos</option>
            <option value="Medicamentos">Medicamentos</option>
            <option value="Agua">Agua</option>
            <option value="Higiene y aseo">Higiene y aseo</option>
            <option value="Ropa y cobijas">Ropa y cobijas</option>
        </select>

        <!-- Casilla especial para alimentos -->
        <div id="divEnlatado" class="hidden">
            <label><input type="checkbox" id="esEnlatado" style="width: auto;"> Este producto es un enlatado</label>
        </div>

        <label>Elemento (Ej. Arroz, Atún, Paracetamol):</label>
        <input type="text" id="elemento" required>

        <div style="display: flex; gap: 10px;">
            <div style="width: 50%;">
                <label>Cantidad:</label>
                <input type="number" id="cantidad" min="1" required>
            </div>
            <div style="width: 50%;">
                <label>Unidad:</label>
                <select id="unidad" required>
                    <option value="unidad">Unidad</option>
                    <option value="kg">Kg</option>
                    <option value="L">Litros</option>
                    <option value="caja">Caja</option>
                    <option value="paquete">Paquete</option>
                </select>
            </div>
        </div>

        <label>Fecha de Vencimiento:</label>
        <input type="date" id="fechaVencimiento" required>

        <label>Responsable (Quién registra esto):</label>
        <input type="text" id="responsable" placeholder="Tu nombre o documento" required>

        <label>Observaciones (Opcional):</label>
        <input type="text" id="observaciones">

        <button type="submit" id="btnGuardar">Guardar Registro</button>
    </form>
</div>

<script>
    // URL que generaste en Google Apps Script
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz268H9EbYUUp-aDNOiy6USxqcT-b5GHkNSI9KXCgXYlL7MleihZhRLfxmHH3OzHIxs/exec';

    // Mostrar u ocultar la opción de enlatado si eligen Alimentos
    function verificarCategoria() {
        const cat = document.getElementById('categoria').value;
        const divEnlatado = document.getElementById('divEnlatado');
        if (cat === 'Alimentos') {
            divEnlatado.classList.remove('hidden');
        } else {
            divEnlatado.classList.add('hidden');
            document.getElementById('esEnlatado').checked = false;
        }
    }

    document.getElementById('formularioAcopio').addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. LÓGICA DE VALIDACIÓN DE ENLATADOS (MAYOR A 3 MESES)
        const esEnlatado = document.getElementById('esEnlatado').checked;
        const inputFechaVencimiento = document.getElementById('fechaVencimiento').value;
        
        if (esEnlatado && inputFechaVencimiento) {
            const fechaVencimiento = new Date(inputFechaVencimiento);
            const hoy = new Date();
            // Le sumamos 3 meses a la fecha de hoy
            const tresMesesDespues = new Date(hoy.setMonth(hoy.getMonth() + 3));
            
            if (fechaVencimiento <= tresMesesDespues) {
                alert("❌ ATENCIÓN: El producto es un enlatado y vence en menos de 3 meses. Por protocolo de seguridad, no se puede recibir en el Centro de Acopio.");
                return; // Detiene el envío
            }
        }

        // 2. CAMBIAR ESTADO DEL BOTÓN MIENTRAS ENVÍA
        const boton = document.getElementById('btnGuardar');
        boton.textContent = 'Guardando...';
        boton.classList.add('cargando');
        boton.disabled = true;

        // 3. GENERAR ID ÚNICO Y FECHAS
        const idUnico = 'REG-' + Date.now();
        const fechaActual = new Date().toLocaleDateString('es-CO');
        const horaActual = new Date().toLocaleTimeString('es-CO');

        // 4. RECOPILAR DATOS PARA ENVIAR
        const datos = {
            id: idUnico,
            fecha: fechaActual,
            hora: horaActual,
            movimiento: document.getElementById('movimiento').value,
            categoria: document.getElementById('categoria').value,
            elemento: document.getElementById('elemento').value + (esEnlatado ? " (Enlatado)" : ""),
            cantidad: document.getElementById('cantidad').value,
            unidad: document.getElementById('unidad').value,
            fecha_vencimiento: inputFechaVencimiento,
            responsable: document.getElementById('responsable').value,
            observaciones: document.getElementById('observaciones').value
        };

        // 5. ENVIAR DATOS A GOOGLE SHEETS
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Evita bloqueos de seguridad del navegador al enviar a Google
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        }).then(() => {
            alert("✅ Registro guardado exitosamente.\nID: " + idUnico);
            document.getElementById('formularioAcopio').reset();
            verificarCategoria();
        }).catch(error => {
            console.error('Error:', error);
            alert("❌ Hubo un error al guardar. Revisa tu conexión a internet.");
        }).finally(() => {
            // Restaurar el botón
            boton.textContent = 'Guardar Registro';
            boton.classList.remove('cargando');
            boton.disabled = false;
        });
    });
</script>
</body>
</html>
